name: surf
description: すれ違いマッチングアプリ - 改造車・スポーツカーオーナー向け
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase BaaS
  supabase_flutter: ^2.5.6

  # 状態管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ルーティング
  go_router: ^13.2.0

  # GPS位置情報
  geolocator: ^12.0.0

  # Bluetooth LE
  flutter_blue_plus: ^1.32.12

  # プッシュ通知
  firebase_core: ^3.2.0
  firebase_messaging: ^15.1.0

  # サブスク決済 (RevenueCat)
  purchases_flutter: ^8.0.0

  # 広告 (AdMob) + iOS ATT
  google_mobile_ads: ^5.1.0
  app_tracking_transparency: ^2.0.6

  # 画像関連
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  # アップロード前のEXIF(位置情報)除去・リサイズ用
  image: ^4.2.0

  # SNSログイン
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # UI補助
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0
  intl: ^0.20.2
  permission_handler: ^11.3.1

  # 地図 (愛車ガード)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ローカル通知・スケジュール通知
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # バックグラウンドサービス（BLE常時検知）
  flutter_background_service: ^5.0.5

  # ローカルストレージ
  shared_preferences: ^2.3.1

  # フォーム・バリデーション
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
